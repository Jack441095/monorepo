name: Mirror to personal account

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push mirror to Jack441095/monorepo
        run: |
          git remote add personal https://Jack441095:${{ secrets.PERSONAL_MIRROR_TOKEN }}@github.com/Jack441095/monorepo.git
          git push personal main --force
