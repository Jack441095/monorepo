name: Mirror to personal account

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to Jack441095/monorepo
        env:
          TOKEN: ${{ secrets.PERSONAL_MIRROR_TOKEN }}
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git remote add personal "https://Jack441095:${TOKEN}@github.com/Jack441095/monorepo.git"
          git push personal main --force
