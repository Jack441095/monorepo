name: KENN integration

on:
  pull_request:
    paths:
      - "products/kenn/**"
      - ".github/workflows/kenn-integration.yml"
  push:
    branches:
      - main
      - integration/kenn-single-repo
      - cleanup/kenn-final-organization
    paths:
      - "products/kenn/**"
      - ".github/workflows/kenn-integration.yml"

permissions:
  contents: read

jobs:
  backend:
    name: KENN backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/kenn/apps/backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/kenn/apps/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the reviewed retrieval index
        run: |
          if [ -d src/kenn/Training_Data_Notes ] && find src/kenn/Training_Data_Notes -type f -name '*.md' -print -quit | grep -q .; then
            PYTHONPATH=src python -m kenn.main build
          else
            echo "Local knowledge corpus is excluded from this checkout; skipping generated index build."
          fi

      - name: Run KENN backend tests
        run: PYTHONPATH=src:../../tooling pytest -q src/kenn/tests

  frontend:
    name: KENN frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/kenn/apps/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: products/kenn/apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
