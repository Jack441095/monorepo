name: KENN core

on:
  push:
    paths:
      - "products/kenn/**"
      - ".github/workflows/kenn-core.yml"
  pull_request:
    paths:
      - "products/kenn/**"
      - ".github/workflows/kenn-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Backend and scoped services
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: products/kenn/apps/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r products/kenn/apps/backend/requirements.txt

      - name: Run core verification
        working-directory: products/kenn
        run: PYTHON=python bash tooling/scripts/ci_verification.sh

  frontend:
    name: Frontend clean install, audit, test, and build
    runs-on: macos-14
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/kenn/apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: products/kenn/apps/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run unit tests
        run: npm test

      - name: Build production client
        run: npm run build
