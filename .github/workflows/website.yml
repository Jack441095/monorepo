name: website

# Manual validation only. This workflow builds and browser-tests the website
# with checkout closed; it never deploys or contacts Paddle. Website hosting
# remains controlled by its hosting provider, not by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e
