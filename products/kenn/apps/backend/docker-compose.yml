version: '3.8'

services:
  kenn-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kenn-public-beta
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - HOST=0.0.0.0
      - KENN_CHAT_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8090
      - KENN_CHAT_RATE_LIMIT_REQUESTS=30
      - KENN_CHAT_RATE_LIMIT_WINDOW_SECONDS=60.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
