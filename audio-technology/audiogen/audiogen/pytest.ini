[pytest]
testpaths = tests ../tests ../scripts/setup
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: heavier or IO-bound tests; run with `pytest -m slow`
    isolated: run in a subprocess (auto-applied to RT/audio tests; see tests/conftest.py)
    benchmark: whole-system or performance benchmarks (typically slow/local)

