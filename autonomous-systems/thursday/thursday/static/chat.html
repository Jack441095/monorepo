<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Thursday</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8; --fg: #1a1a1a; --card: #ffffff; --border: #e0e0e0;
    --accent: #2d6cdf; --bubble-user: #2d6cdf; --bubble-user-fg: #ffffff;
    --bubble-bot: #ffffff; --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316; --fg: #f0f0f0; --card: #1c1c20; --border: #2c2c31;
      --bubble-user: #2d6cdf; --bubble-user-fg: #ffffff;
      --bubble-bot: #1f1f24; --muted: #9a9aa0;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    /* 100vh first as a universally-supported fallback, then 100dvh where
       supported -- a browser that doesn't understand 100dvh ignores that
       declaration entirely and keeps the 100vh above it, rather than
       collapsing to auto/0 height (which silently produced a blank page:
       html/body get no height, so the flex column has nothing to lay out
       into, even though every child element is present in the DOM). */
    height: 100vh;
    height: 100dvh;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  header .right { display: flex; align-items: center; gap: 10px; }
  #speakToggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .msg.bot { position: relative; }
  .speakBtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; margin-top: 6px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card); color: var(--fg);
    font-size: 12px; cursor: pointer; opacity: 0.7;
  }
  .speakBtn:hover { opacity: 1; }
  .speakBtn.playing { opacity: 1; border-color: var(--accent); }
  #log {
    flex: 1; overflow-y: auto; padding: 12px 12px 4px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 88%; padding: 10px 13px; border-radius: 14px;
    white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px;
  }
  .msg.user {
    align-self: flex-end; background: var(--bubble-user); color: var(--bubble-user-fg);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start; background: var(--bubble-bot); color: var(--fg);
    border: 1px solid var(--border); border-bottom-left-radius: 4px;
  }
  .msg.error { border-color: #d33; color: #d33; }
  .msg.pending { color: var(--muted); font-style: italic; }
  form {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); flex-shrink: 0; background: var(--bg);
  }
  input[type=text] {
    flex: 1; padding: 11px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); color: var(--fg); font-size: 15px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 0 18px; border-radius: 20px; border: none; background: var(--accent);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  #tokenGate {
    position: fixed; inset: 0; background: var(--bg); display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; text-align: center;
  }
  #tokenGate input { width: 100%; max-width: 320px; }
  #tokenGate p { color: var(--muted); font-size: 13px; max-width: 320px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="tokenGate">
  <h1>Thursday</h1>
  <p>Enter the server token to connect (from Audio_Too/.env → THURSDAY_SERVER_TOKEN). Stored only on this device. Tip: bookmark this page's URL with <code>?token=your-token</code> appended so a Home Screen icon never asks again.</p>
  <input type="password" id="tokenInput" placeholder="Server token" autocomplete="off">
  <button id="tokenSubmit">Connect</button>
</div>

<header id="chatHeader" hidden>
  <h1>Thursday</h1>
  <div class="right">
    <label id="speakToggle"><input type="checkbox" id="speakCheckbox"> 🔊 Speak replies</label>
    <span class="status" id="statusLine">connecting…</span>
  </div>
</header>
<div id="log" hidden></div>
<form id="composer" hidden>
  <input type="text" id="input" placeholder="Ask Thursday…" autocomplete="off" autocapitalize="sentences">
  <button type="submit">Send</button>
</form>

<script>
(function () {
  var TOKEN_KEY = "thursday_token";
  var gate = document.getElementById("tokenGate");
  var header = document.getElementById("chatHeader");
  var statusLine = document.getElementById("statusLine");
  var log = document.getElementById("log");
  var composer = document.getElementById("composer");
  var input = document.getElementById("input");
  var tokenInput = document.getElementById("tokenInput");
  var tokenSubmit = document.getElementById("tokenSubmit");
  var speakCheckbox = document.getElementById("speakCheckbox");
  var SPEAK_KEY = "thursday_speak_replies";
  var currentAudio = null;

  function getToken() {
    try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {}
  }

  // A token in the URL (?token=...) always wins and is saved immediately.
  // This exists because iOS "Add to Home Screen" web apps can have their
  // localStorage cleared more aggressively than a normal Safari tab, which
  // otherwise means re-entering the token every time the icon is reopened.
  // Bookmarking (or re-adding to home screen) a link that already carries
  // the token makes that specific bookmark/icon work every time regardless
  // of storage eviction. Trade-off: the token then lives in that one URL,
  // so don't share the link -- it's equivalent to sharing the token itself.
  function tokenFromUrl() {
    try {
      var params = new URLSearchParams(window.location.search);
      return params.get("token") || "";
    } catch (e) { return ""; }
  }

  function addMessage(text, cls) {
    var el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function getSpeakEnabled() {
    try { return localStorage.getItem(SPEAK_KEY) === "1"; } catch (e) { return false; }
  }
  function setSpeakEnabled(on) {
    try { localStorage.setItem(SPEAK_KEY, on ? "1" : "0"); } catch (e) {}
  }

  // Fetches real Kokoro-synthesised audio from /speak and plays it. Only
  // one reply plays at a time -- starting a new one stops whatever's
  // already playing, so replies don't overlap if the user is quick.
  async function speak(text, btn) {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    document.querySelectorAll(".speakBtn.playing").forEach(function (b) {
      b.classList.remove("playing");
      b.textContent = "▶";
    });
    if (!text) return;
    if (btn) { btn.textContent = "…"; btn.classList.add("playing"); }
    try {
      var res = await fetch("/speak", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + getToken()
        },
        body: JSON.stringify({ text: text, voice: "thursday" })
      });
      if (!res.ok) throw new Error("speak failed (" + res.status + ")");
      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      var audio = new Audio(url);
      currentAudio = audio;
      if (btn) { btn.textContent = "⏸"; }
      audio.addEventListener("ended", function () {
        URL.revokeObjectURL(url);
        if (btn) { btn.textContent = "▶"; btn.classList.remove("playing"); }
        if (currentAudio === audio) currentAudio = null;
      });
      await audio.play();
    } catch (e) {
      if (btn) { btn.textContent = "▶"; btn.classList.remove("playing"); }
      console.error("Thursday speak() failed:", e);
    }
  }

  function addSpeakButton(container, text) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "speakBtn";
    btn.textContent = "▶";
    btn.setAttribute("aria-label", "Play reply aloud");
    btn.addEventListener("click", function () { speak(text, btn); });
    container.appendChild(btn);
    return btn;
  }

  async function checkHealth() {
    try {
      var res = await fetch("/health");
      var data = await res.json();
      statusLine.textContent = data.ok ? "connected" : "server unhealthy";
    } catch (e) {
      statusLine.textContent = "cannot reach server";
    }
  }

  async function send(question) {
    addMessage(question, "user");
    var pending = addMessage("thinking…", "bot pending");
    try {
      var res = await fetch("/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + getToken()
        },
        body: JSON.stringify({ question: question })
      });
      var data = await res.json();
      pending.remove();
      if (res.status === 401) {
        addMessage("Token rejected. Reload the page to enter it again.", "bot error");
        return;
      }
      if (!data.ok) {
        addMessage(data.error || "Something went wrong.", "bot error");
        return;
      }
      var answer = data.answer || "(no answer)";
      var botEl = addMessage(answer, "bot");
      var speakBtn = addSpeakButton(botEl, answer);
      if (getSpeakEnabled()) speak(answer, speakBtn);
    } catch (e) {
      pending.remove();
      addMessage("Network error — check you're on the same Tailscale network. " + e.message, "bot error");
    }
  }

  composer.addEventListener("submit", function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (!q) return;
    input.value = "";
    send(q);
  });

  tokenSubmit.addEventListener("click", function () {
    var t = tokenInput.value.trim();
    if (!t) return;
    setToken(t);
    startChat();
  });
  tokenInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") tokenSubmit.click();
  });

  speakCheckbox.addEventListener("change", function () {
    setSpeakEnabled(speakCheckbox.checked);
  });

  function startChat() {
    gate.hidden = true;
    header.hidden = false;
    log.hidden = false;
    composer.hidden = false;
    speakCheckbox.checked = getSpeakEnabled();
    input.focus();
    checkHealth();
  }

  var urlToken = tokenFromUrl();
  if (urlToken) {
    setToken(urlToken);
    startChat();
  } else if (getToken()) {
    startChat();
  }
})();
</script>
</body>
</html>
