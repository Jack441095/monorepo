app = "nite-dsp-backend"
primary_region = "ams"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one API machine warm so payment webhooks do not wait on a cold start.
  min_machines_running = 1

[[http_service.checks]]
  # Liveness stays independent of database/storage readiness during deploys.
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
