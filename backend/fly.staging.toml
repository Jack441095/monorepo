# API testing can tolerate cold starts, so idle staging machines stop to
# avoid paying for a continuously running backend between test sessions.

app = 'nite-dsp-staging-backend'
primary_region = 'lhr'

[build]
[deploy]
  release_command = 'alembic upgrade head'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
