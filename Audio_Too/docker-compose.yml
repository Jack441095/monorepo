version: '3.8'

services:
  web-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: nite-dsp:latest
    container_name: nite_dsp_web_server
    command: ["web-server"]
    ports:
      - "8080:8080"
    environment:
      - AUDIO_TOO_HOST=0.0.0.0
      - AUDIO_TOO_PORT=8080
      - AUDIO_TOO_DEV=1
      - AUDIO_TOO_DASHBOARD_PASSWORD=${AUDIO_TOO_DASHBOARD_PASSWORD:-admin123}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      # See Dockerfile's HEALTHCHECK comment: the real server has no /healthz route.
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  automix-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: nite-dsp:latest
    container_name: nite_dsp_automix_worker
    command: ["automix-worker"]
    environment:
      - AUDIO_TOO_DEV=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      web-server:
        condition: service_healthy
    restart: unless-stopped

  thursday-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: nite-dsp:latest
    container_name: nite_dsp_thursday_agent
    command: ["thursday-agent"]
    environment:
      - AUDIO_TOO_DEV=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      web-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  audio_data:
    driver: local
