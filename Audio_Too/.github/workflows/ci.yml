name: CI

# Linux-only gate. This intentionally does NOT run `./audio-too check` (the
# authoritative local gate) -- that gate needs macOS/Apple Silicon (MLX for
# KENN-LM and Kokoro TTS, native arm64 numba for AudioGen DSP, real CoreAudio
# devices for realtime playback), none of which exist on a standard
# ubuntu-latest runner. This workflow runs the subset of checks that are
# genuinely meaningful on Linux and stays silent (rather than red) about
# everything else. Full coverage still requires a human `./audio-too check`
# run on Apple Silicon before a release. See docs/CI.md for the exact scope
# and the reasoning behind every exclusion below.
#
# History note: a `.github/workflows/ci.yml` existed before this rewrite and
# ran `python3 main.py check` (the full local gate) on every push -- it
# failed on all 87/87 recorded runs, first on pre-existing ruff-lint debt
# unrelated to any given change, and would have kept failing afterward on
# the macOS-only test domains even if lint were clean. A CI badge that has
# never once been green provides zero signal and trains everyone to ignore
# it, which is worse than no CI at all. This file replaces it with a scope
# that is actually expected to pass. Automatic runs are disabled because this
# repository is used as a code backup; run the workflow manually when CI
# evidence is deliberately needed.

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIO_TOO_DEV: "1"
      AUDIO_TOO_DASHBOARD_PASSWORD: ci-dashboard-password
      AUDIO_TOO_SESSION_SECRET: ci-session-secret-placeholder-32-chars-minimum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Keep in sync with .python-version (the version main.py's
          # supported_python() gate and ./audio-too setup both enforce).
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt's numpy/numba/llvmlite pins are conditioned on
          # platform_machine (see the comment block at the top of that file);
          # ubuntu-latest is x86_64, so it resolves the same numpy<2.1 /
          # numba==0.60.0 / llvmlite==0.43.0 branch as this project's Intel
          # macOS venv, and kokoro-onnx (platform_system == "Darwin" only,
          # and the torch/transformers/accelerate stack it pulls in) is
          # correctly skipped. Verified by simulating a manylinux2014_x86_64
          # resolution locally before writing this workflow. Deliberately
          # NOT `python3 main.py setup`: that also installs
          # studio/kenn/kenn's + AudioGen's own requirement files and
          # business/agents/requirements-optional.txt (torch/transformers,
          # optional and heavy) -- more than this Linux-only job needs.
          pip install -r requirements.txt
          # Dev-only tooling (ruff, pytest) lives in requirements-dev.txt, not
          # requirements.txt (so customer installs stay lean). CI needs it for
          # the lint and test steps below -- without it the critical-lint hard
          # gate errors with "ruff: not found" and fails every run.
          pip install -r requirements-dev.txt

      - name: Ruff -- critical (syntax errors / undefined names, hard gate)
        # Routed through `main.py lint` (same command/target list as
        # `./audio-too lint` locally) rather than hand-rolled, so this can't
        # silently drift from what cmd_lint actually runs.
        run: python3 main.py lint --select E9,F63,F7,F82

      - name: Ruff -- full lint (advisory, see docs/CI.md)
        # There is real, pre-existing style-lint debt in this repo (unused
        # imports etc., ~56 findings as of this commit) that predates this
        # workflow and isn't a regression signal by itself. Hard-failing CI
        # on it would just recreate the permanently-red badge this rewrite
        # exists to fix (see docs/CI.md). Mirrors the same critical-lint/
        # lint-advisory split scripts/eval/full_test_suite.py already uses
        # locally. Still runs and is visible in the job log/UI as a
        # non-blocking warning.
        continue-on-error: true
        run: python3 main.py lint

      - name: Repo hygiene
        run: python3 main.py hygiene check

      - name: Build KENN retrieval index
        # The retrieval index (chunks.jsonl + terms.json under
        # studio/kenn/kenn/data/index/versions/) is git-ignored, so a fresh CI
        # checkout has none and every KENN/chat/mix-review test that touches
        # retrieval raised "Index not found". Build it from the committed
        # Training_Data_Notes/. This is BM25-only here: build_index.py wraps the
        # embedding step in try/except and falls back to "BM25 only" when the
        # ~90 MB all-MiniLM ONNX model (fetched separately, git-ignored) is
        # absent — so no model download or network to Hugging Face is needed.
        run: python3 main.py ableton build

      - name: Core test suite (Linux-safe subset)
        # Mirrors scripts/eval/full_test_suite.py's own "core-tests" command
        # (tests minus tests/audiogen, tests/audio_analysis, and
        # test_latency.py -- the domains that need a native arm64 Python
        # with numba/MLX and real audio hardware, see docs/CI.md), plus one
        # more exclusion found while verifying this workflow:
        # test_finetune_lora_dataset.py imports studio/kenn/kenn/finetune/
        # finetune_lora.py, which does `import torch` / `from transformers
        # import ...` unconditionally at module level. Those only live in
        # business/agents/requirements-optional.txt (an intentionally
        # optional, heavy, experimental-LoRA install -- see that file's own
        # comments), not requirements.txt, so this one file has no
        # unconditional dependency covered by this job's install step.
        # Confirmed via a from-scratch venv with only `pip install -r
        # requirements.txt`: 1329 passed, 6 skipped (Ollama not available --
        # expected, no local model server in CI), 0 failed.
        # Update 2026-08-11: tests/audio_analysis is still excluded HERE
        # (this step's verified count above is left unchanged), but is no
        # longer CI-uncovered overall -- see the separate "Audio analysis
        # test suite" step below, which runs it directly.
        # --deselect below, two reasons:
        # (A) Need git-ignored heavy artifacts CI legitimately lacks — the ~90 MB
        #     all-MiniLM ONNX model, the trained reranker, and the release-package
        #     model files (kenn_lora / markov .pkl). Same class as the ignored
        #     audiogen/audio_analysis domains.
        # (B) test_business_server_sys_path...: the autonomous-producer feature
        #     (imported by thursday_routes) makes the business server depend on
        #     AudioGen's `composition`/`training` packages, so the server no longer
        #     imports under the lean sys.path this test asserts. Accepted coupling;
        #     the user-facing thursday_routes 404 regressions are fixed and DO run.
        run: >
          python3 main.py test -q --disable-warnings tests
          --ignore=tests/audiogen
          --ignore=tests/audio_analysis
          --ignore=tests/test_latency.py
          --ignore=tests/test_finetune_lora_dataset.py
          --deselect "tests/kenn/test_kenn_gap_clustering.py::test_cluster_queries_accepts_pairs_not_only_triples"
          --deselect "tests/kenn/test_kenn_gap_clustering.py::test_default_thresholds_find_clusters_in_realistic_sparse_data"
          --deselect "tests/kenn/test_kenn_product_package.py::test_kenn_product_package_boots_and_serves_with_zero_thursday_or_business_agents"
          --deselect "tests/test_release_health_check.py::test_measure_model_dependencies_against_the_real_restored_repo_state"
          --deselect "tests/test_release_health_latency.py::test_kenn_retrieval_latency_meets_slo"
          --deselect "tests/test_release_package.py::test_current_release_package_is_complete_relocatable_and_private"
          --deselect "tests/test_retrieval_topics.py::test_trained_reranker_model_loads_and_scores_without_torch"
          --deselect "tests/mix/test_mix_review_cli.py::test_business_server_sys_path_resolves_revision_agent_import"

      - name: Audio analysis test suite
        # Added 2026-08-11: this domain was previously excluded from CI
        # entirely on the assumption it needs native arm64/hardware -- but
        # verified locally (1511 passed, 2 skipped, 0 failed) that it's pure
        # NumPy/SciPy/numba computation with no real-audio-device dependency.
        # The C++ kernels under dsp_engine/native/ already select `g++` on
        # non-Darwin platforms and wrap the compile in
        # `except (FileNotFoundError, subprocess.CalledProcessError): return
        # None` -- if compilation isn't available here, callers fall back to
        # the pure-Python/numba path automatically (same graceful-degradation
        # design used in production, not a CI-only shortcut). This is
        # additive: it does not change the "Core test suite" step above,
        # which still excludes tests/audio_analysis to preserve its
        # separately-verified pass count.
        run: python3 main.py test -q --disable-warnings tests/audio_analysis

      - name: KENN benchmark + regression gate
        # Added 2026-08-11: scripts/eval/kenn_benchmark_gate.py existed but
        # was only wired into the local `./audio-too check` gate, so a
        # regression in KENN's answer quality/latency/citation validity
        # could ship without anything catching it automatically. Verified
        # locally that this genuinely runs BM25-only here too (the ~90 MB
        # embedding model is git-ignored, same as the "Build KENN retrieval
        # index" step above already assumes) -- confirmed by temporarily
        # removing the local model file and rebuilding: 128/128 benchmark
        # cases still passed and the gate still exited 0 in that exact
        # configuration. No LLM/Ollama call is involved (chat_only rewrite
        # is gated behind AUDIO_TOO_LLM_ENABLED, unset here).
        run: |
          python3 main.py benchmark
          python3 main.py benchmark-gate

      - name: Thursday held-out routing gate
        # Deterministic rule-based intent routing (thursday/orchestrator.py's
        # classify_request) -- no LLM/MLX/Ollama call in this path, so it's
        # genuinely Linux-safe. Verified standalone with only requirements.txt
        # installed: 510/510 cases, 100% accuracy, exit 0.
        run: python -m thursday.evals.benchmark
